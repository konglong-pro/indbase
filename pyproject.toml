[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "indbase"
version = "0.1.0"
description = "Local-first personal knowledge database foundation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "indbase maintainers" }
]
dependencies = [
  "inquirerpy>=0.3.4",
  "rich>=13.9",
  "typer>=0.15",
]

[project.optional-dependencies]
consoler-agent = [
  "consoler-agent-sdk==0.1.0",
]
swallow = [
  "swallow @ git+https://github.com/konglong-pro/swallow.git@f0f7fa80c0f7f5959d1d325bb5c3eb9b32082a1d",
]
swallow-playwright = [
  "swallow @ git+https://github.com/konglong-pro/swallow.git@f0f7fa80c0f7f5959d1d325bb5c3eb9b32082a1d",
  "markdownify>=0.14",
  "playwright>=1.52",
]

[project.scripts]
indb = "indbase_cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/indbase_core",
  "src/indbase_cli",
  "src/indbase_agent",
  "src/indbase_integrations",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "transition_smoke: real Node transition bridge smoke test (requires INDBASE_TRANSITION_SMOKE=1)",
]
