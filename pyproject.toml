[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "indbase"
version = "0.1.0"
description = "Local-first personal knowledge database foundation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "indbase maintainers" }
]
dependencies = [
  "inquirerpy>=0.3.4",
  "rich>=13.9",
  "typer>=0.15",
]

[project.optional-dependencies]
convert = [
  "markitdown>=0.1.0",
]

[project.scripts]
indb = "indbase_cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/indbase_core",
  "src/indbase_cli",
]

[tool.hatch.build.targets.wheel.force-include]
"src/indbase_core/migrations" = "indbase_core/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
