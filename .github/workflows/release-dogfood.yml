# Layer E — real-corpus dogfood (manual / scheduled). Not required on every PR.

name: Release dogfood

on:
  workflow_dispatch:
    inputs:
      use_repo_fixture:
        description: Use tests/fixtures/v02_dogfood_corpus (for CI-style smoke)
        type: boolean
        default: true
  schedule:
    # Weekly Sunday 00:00 UTC — uses repo fixture when present
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  real-corpus:
    name: E — real-corpus dogfood
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with swallow
        run: uv sync --group dev --extra swallow

      - name: Resolve corpus path
        id: corpus
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ vars.INDB_REAL_CORPUS }}" ]; then
            echo "path=${{ vars.INDB_REAL_CORPUS }}" >> "$GITHUB_OUTPUT"
            echo "mode=repository_variable"
            exit 0
          fi
          USE_FIXTURE="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            USE_FIXTURE="${{ github.event.inputs.use_repo_fixture }}"
          fi
          if [ "$USE_FIXTURE" = "true" ]; then
            FIXTURE="${{ github.workspace }}/tests/fixtures/v02_dogfood_corpus"
            if [ ! -d "$FIXTURE" ]; then
              echo "::error::Fixture corpus missing at tests/fixtures/v02_dogfood_corpus"
              exit 1
            fi
            echo "path=$FIXTURE" >> "$GITHUB_OUTPUT"
            echo "mode=repo_fixture"
            exit 0
          fi
          echo "::error::Set repository variable INDB_REAL_CORPUS or run with use_repo_fixture=true"
          exit 1

      - name: Real corpus dogfood gate
        run: uv run python scripts/v02_real_corpus_dogfood_gate.py
        env:
          INDB_REAL_CORPUS: ${{ steps.corpus.outputs.path }}
          PYTHONIOENCODING: utf-8
