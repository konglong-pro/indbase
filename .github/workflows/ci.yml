# v0.2 active CI — see docs/planning/v0.2-release-gate-checkpoint.md
# Historical scripts/m3_dogfood_gate.py is NOT a required check here.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: A/B — pytest + compileall
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Pytest
        run: uv run python -m pytest
        env:
          PYTHONIOENCODING: utf-8

      - name: Compileall
        run: uv run python -m compileall -q src tests scripts

  v02-deterministic:
    name: C — v0.2 deterministic vault + doctor negative
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with swallow extra
        run: uv sync --group dev --extra swallow

      - name: v0.2 deterministic release gate
        run: uv run python scripts/v02_deterministic_release_gate.py
        env:
          PYTHONIOENCODING: utf-8

      - name: v0.2 doctor negative gate
        run: uv run python scripts/doctor_negative_gate.py
        env:
          PYTHONIOENCODING: utf-8

  taxonomy-n1:
    name: C2 — v0.3.1 taxonomy N1 gates
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --extra swallow

      - name: v0.3.1 taxonomy release gate
        run: uv run python scripts/v031_taxonomy_release_gate.py
        env:
          PYTHONIOENCODING: utf-8

      - name: v0.3.1 taxonomy CLI acceptance e2e
        run: uv run python scripts/v031_acceptance_e2e.py
        env:
          PYTHONIOENCODING: utf-8

  retrieval-v032:
    name: C3 — v0.3.2 retrieval release gate
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with swallow extra
        run: uv sync --group dev --extra swallow

      - name: v0.3.2 retrieval release gate
        run: uv run python scripts/v032_retrieval_release_gate.py
        env:
          PYTHONIOENCODING: utf-8

  swallow-smoke:
    name: D — real swallow smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with swallow extra
        run: uv sync --group dev --extra swallow

      - name: Real swallow smoke gate
        run: uv run python scripts/v02_swallow_smoke_gate.py
        env:
          INDBASE_SWALLOW_SMOKE: "1"
          PYTHONIOENCODING: utf-8

  transition-smoke:
    name: D — real Node transition smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: uv sync --group dev

      - name: Real transition bridge smoke gate
        run: uv run python scripts/v02_transition_smoke_gate.py
        env:
          INDBASE_TRANSITION_SMOKE: "1"
          PYTHONIOENCODING: utf-8
